name: Index, industry, shares and reference prices
on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Bounded acquisition time; checkpointed work resumes next run
        type: choice
        options: ['1200', '300', '600']
        default: '1200'
      source_scope:
        description: Collect all references or verify the configured SEC path
        type: choice
        options: ['all', 'sec']
        default: 'all'
permissions:
  contents: read
concurrency:
  group: durable-market-reference-publication
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-delta.txt
      - run: python -m pip install -r requirements-delta.txt
      - name: Validate source contracts, checkpoint resume and cloud isolation
        run: python -m pytest tests/test_market_reference_sources.py tests/test_market_reference_pipeline.py tests/test_research_ownership.py -q
      - name: Collect and publish authenticated encrypted reference increments
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          PRICE_DATA_KEY: ${{ secrets.PRICE_DATA_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          COLLECTION_SECONDS: ${{ inputs.seconds || '1200' }}
          REFERENCE_SOURCE_SCOPE: ${{ inputs.source_scope || 'all' }}
        run: python scripts/market_reference_pipeline.py --seconds "$COLLECTION_SECONDS" --max-requests 50 --max-batches 100 --source-scope "$REFERENCE_SOURCE_SCOPE"
