name: Encrypted daily price changes
on:
  schedule:
    # Post-US-close; IANA timezone follows DST. 08:37/09:37 next day in Seoul.
    - cron: '37 19 * * *'
      timezone: America/New_York
    # Post-Korea-close; weekends retained for crypto and revision checks.
    - cron: '37 20 * * *'
      timezone: Asia/Seoul
    # Verify the non-DB package log every six hours.
    - cron: '17 */6 * * *'
      timezone: UTC
  workflow_dispatch:
    inputs:
      audit:
        description: 'Recheck one bounded historical correction window'
        required: false
        type: boolean
        default: false
      integration_only:
        description: 'Verify the latest encrypted daily package only'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: durable-price-publication
  queue: max
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-10-15
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, verified 2026-10-15
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-delta.txt
      - name: Install pinned runtime
        run: python -m pip install -r requirements-delta.txt
      - name: Validate DB-free collection and encryption contracts
        run: python -m pytest tests/test_daily_delta_codec.py tests/test_daily_delta_collect.py tests/test_cloud_daily_runtime.py tests/test_daily_delta_transport.py -q
      - name: Collect and publish encrypted daily additions and corrections
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          PRICE_DATA_KEY: ${{ secrets.PRICE_DATA_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          FULL_AUDIT: ${{ inputs.audit && 'true' || 'false' }}
          INTEGRATION_ONLY: ${{ (inputs.integration_only || github.event.schedule == '17 */6 * * *') && 'true' || 'false' }}
        run: |
          if [ "$INTEGRATION_ONLY" = "true" ]; then
            python scripts/price_pipeline.py --integration-only
          elif [ "$FULL_AUDIT" = "true" ]; then
            python scripts/price_pipeline.py --audit
          else
            python scripts/price_pipeline.py
          fi
