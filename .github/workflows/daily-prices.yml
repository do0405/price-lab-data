name: Durable daily prices
on:
  schedule:
    # Post-US-close; IANA timezone follows DST. 08:37/09:37 next day in Seoul.
    - cron: '37 19 * * *'
      timezone: America/New_York
    # Post-Korea-close; weekends retained for crypto and revision checks.
    - cron: '37 20 * * *'
      timezone: Asia/Seoul
  workflow_dispatch:
    inputs:
      audit:
        description: 'Reconcile complete retained history'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: durable-price-publication
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-10-15
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, verified 2026-10-15
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ingestion.txt
      - name: Install pinned runtime
        run: python -m pip install -r requirements-ingestion.txt
      - name: Validate pipeline contracts
        run: python -m pytest tests -q
      - name: Restore, collect, validate and publish encrypted checkpoint
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          PRICE_DATA_KEY: ${{ secrets.PRICE_DATA_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          FULL_AUDIT: ${{ inputs.audit && 'true' || 'false' }}
        run: |
          if [ "$FULL_AUDIT" = "true" ]; then
            python scripts/price_pipeline.py --audit
          else
            python scripts/price_pipeline.py
          fi
